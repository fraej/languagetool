plugins {
    id 'java-library'
}

def bundledLanguages = ['en', 'es', 'ca']

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Stream.toList() is newer than Android's desugared Java library. Adapt only
// the Android build, keeping the desktop sources and their API contract intact.
def androidSources = tasks.register('prepareAndroidSources', Sync) {
    inputs.file('build.gradle')
    from '../../languagetool-core/src/main/java'
    bundledLanguages.each { from "../../languagetool-language-modules/${it}/src/main/java" }
    into layout.buildDirectory.dir('generated/sources/languagetool')
    filteringCharset = 'UTF-8'
    filesMatching('**/PatternRuleLoader.java') {
        filter { line ->
            line.replace('PatternRuleHandler handler = new PatternRuleHandler(filename, lang);', 'PatternRuleHandler handler;')
                .replace('handler.setRelaxedMode(relaxedMode);', '')
                .replace('SAXParser saxParser = RuleSaxParser.create();', '')
                .replace('saxParser.parse(is, handler);', 'handler = org.languagetool.offline.AndroidRuleCache.load(is, filename, () -> { PatternRuleHandler fresh = new PatternRuleHandler(filename, lang); fresh.setRelaxedMode(relaxedMode); return fresh; });')
        }
    }
    filesMatching('**/DisambiguationRuleLoader.java') {
        filter { line ->
            line.replace('DisambiguationRuleHandler handler = new DisambiguationRuleHandler(language, xmlPath);', 'DisambiguationRuleHandler handler;')
                .replace('SAXParser saxParser = RuleSaxParser.create();', '')
                .replace('saxParser.parse(stream, handler);', 'handler = org.languagetool.offline.AndroidRuleCache.load(stream, xmlPath, () -> new DisambiguationRuleHandler(language, xmlPath));')
        }
    }
    filter { line ->
        line.replaceAll(/(?<!Collectors)\.toList\(\)/,
                '.collect(java.util.stream.Collectors.toList())')
            // Android's JAXP lookup ignores the desktop factory system property.
            .replace('SAXParserFactory.newInstance()',
                'SAXParserFactory.newInstance("org.apache.xerces.jaxp.SAXParserFactoryImpl", org.languagetool.tools.RuleSaxParser.class.getClassLoader())')
            // Segment uses Android's factory internally, which cannot attach XSD
            // schemas. The packaged SRX is trusted and tested at build time.
            .replace('Map.of(Srx2SaxParser.VALIDATE_PARAMETER, true)',
                'Map.of(Srx2SaxParser.VALIDATE_PARAMETER, false)')
            .replace('Pattern.UNICODE_CHARACTER_CLASS', '0')
            // Keep inactive varieties' large XML rule lists collectible on phones.
            .replace('private volatile List<AbstractPatternRule> patternRules;',
                'private volatile List<AbstractPatternRule> patternRules;\n  public void clearAndroidPatternRules() { synchronized (patternRuleLock) { patternRules = null; } }')
            .replace('is.readAllBytes()', 'com.google.common.io.ByteStreams.toByteArray(is)')
            .replace('inputStream.readAllBytes()', 'com.google.common.io.ByteStreams.toByteArray(inputStream)')
            .replaceAll(/new Scanner\(([^,]+), StandardCharsets\.UTF_8\)/,
                'new Scanner($1, StandardCharsets.UTF_8.name())')
            .replace('HexFormat.of().formatHex(md.digest(data))',
                'com.google.common.io.BaseEncoding.base16().lowerCase().encode(md.digest(data))')
            .replace('com.google.common.base.Suppliers', 'org.languagetool.offline.AndroidSuppliers')
            .replaceAll(/\bSuppliers\./, 'AndroidSuppliers.')
            .replaceAll(/(?<![\w.])(?:java\.util\.regex\.)?Pattern\.(compile|matches)\(/,
                'org.languagetool.offline.AndroidPatterns.$1(')
            .replace('import static java.util.regex.Pattern.compile;',
                'import static org.languagetool.offline.AndroidPatterns.compile;')
            .replace('import static java.util.regex.Pattern.*;',
                'import static java.util.regex.Pattern.*;\nimport static org.languagetool.offline.AndroidPatterns.compile;\nimport static org.languagetool.offline.AndroidPatterns.matches;')
    }
}

// Compile the fork's sources, rather than an unrelated published engine version.
sourceSets {
    main {
        java.srcDirs = ['src/main/java', layout.buildDirectory.dir('generated/sources/languagetool')]
        java.srcDir layout.buildDirectory.dir('generated/sources/morfologik')
        resources.srcDirs = ['src/main/resources', '../../languagetool-core/src/main/resources'] +
                bundledLanguages.collect { "../../languagetool-language-modules/${it}/src/main/resources" }
    }
}

// Reuse the dependency versions and exclusions maintained by the Maven build.
def parentPom = new XmlSlurper().parse(file('../../pom.xml'))
def properties = parentPom.properties.children().collectEntries { [(it.name()): it.text()] }
def expand = { value ->
    value.replaceAll(/\$\{([^}]+)\}/) { match, key -> properties[key] ?: match }
}
def managed = parentPom.dependencyManagement.dependencies.dependency.collectEntries {
    [("${it.groupId.text()}:${it.artifactId.text()}".toString()): expand(it.version.text())]
}

configurations {
    morfologikSources {
        canBeConsumed = false
        transitive = false
    }
}

// Build the same pinned speller from source with the decoder fix. On Android,
// an incomplete UTF-8 sequence can be reported by flush(), rather than decode().
def morfologikSourceTask = tasks.register('prepareMorfologikSources', Sync) {
    inputs.file('build.gradle')
    from(provider { configurations.morfologikSources.collect { zipTree(it) } })
    include 'morfologik/speller/*.java'
    into layout.buildDirectory.dir('generated/sources/morfologik')
    filteringCharset = 'UTF-8'
    filter { line ->
        line.replace('final CoderResult c = decoder.decode(byteBuffer, charBuffer, true);',
                'CoderResult c = decoder.decode(byteBuffer, charBuffer, true);\n      if (c.isUnderflow()) c = decoder.flush(charBuffer);')
            .replace('        decoder.flush(charBuffer);', '')
            .replaceAll(/\b(byteBuffer|charBuffer)\.(clear|flip|position)\(/,
                '((java.nio.Buffer) $1).$2(')
    }
    doLast {
        def source = layout.buildDirectory.file('generated/sources/morfologik/morfologik/speller/Speller.java').get().asFile
        if (!source.text.contains('if (c.isUnderflow()) c = decoder.flush(charBuffer);')) {
            throw new GradleException('Review the Android decoder patch for this Morfologik version.')
        }
    }
}

dependencies {
    morfologikSources "org.carrot2:morfologik-speller:${properties['morfologik.version']}:sources"
    api platform("io.opentelemetry:opentelemetry-bom:${properties['io.opentelemetry.version']}")
    ([file('../../languagetool-core/pom.xml')] + bundledLanguages.collect {
        file("../../languagetool-language-modules/${it}/pom.xml")
    }).each { pomFile ->
        new XmlSlurper().parse(pomFile).dependencies.dependency.each { dep ->
            def group = dep.groupId.text()
            def artifact = dep.artifactId.text()
            def scope = dep.scope.text()
            if (scope == 'test' || group == 'org.languagetool' && artifact == 'languagetool-core') {
                return
            }
            // Segment already brings the javax JAXB implementation it needs.
            // The desktop's Jakarta JAXB 4 runtime is unrelated to that API.
            if (group == 'org.glassfish.jaxb' && artifact == 'jaxb-runtime') {
                return
            }
            def version = expand(dep.version.text()) ?: managed["${group}:${artifact}".toString()]
            // Compile against the same interfaces Android packages, avoiding
            // Java 9 multi-release interface additions in Guava's JRE artifact.
            if (group == 'com.google.guava' && artifact == 'guava') {
                version = version.replace('-jre', '-android')
            }
            def configuration = scope == 'provided' || group == 'org.json' ? 'compileOnly' : 'api'
            add(configuration, version ? "${group}:${artifact}:${version}" : "${group}:${artifact}") {
                dep.exclusions.exclusion.each { item ->
                    exclude group: item.groupId.text(), module: item.artifactId.text()
                }
            }
        }
    }
    annotationProcessor "org.projectlombok:lombok:${properties['lombok.version']}"
    // Android's default XML parser does not support the grammar's parameter entities.
    runtimeOnly('xerces:xercesImpl:2.12.2') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    testImplementation 'junit:junit:4.13.2'
}

configurations.configureEach {
    // This Java module is consumed by Android. Guava's Gradle metadata otherwise
    // selects JRE interfaces for compilation and different interfaces at runtime.
    attributes.attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
            objects.named(TargetJvmEnvironment, TargetJvmEnvironment.ANDROID))
    // jaxb-impl 2.3.3 already contains these core classes and message bundles.
    exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    // Jakarta's 2.3.x coordinates still contain the javax packages.
    exclude group: 'jakarta.xml.bind', module: 'jakarta.xml.bind-api'
    exclude group: 'jakarta.activation', module: 'jakarta.activation-api'
    exclude group: 'javax.activation', module: 'javax.activation-api'
    if (name != 'morfologikSources') {
        // The patched source above supplies these classes instead of the binary JAR.
        exclude group: 'org.carrot2', module: 'morfologik-speller'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn androidSources, morfologikSourceTask
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Each module supplies this same path; merge its class registry explicitly.
    def registries = bundledLanguages.collect {
        file("../../languagetool-language-modules/${it}/src/main/resources/META-INF/org/languagetool/language-module.properties")
    }
    inputs.files(registries)
    exclude 'META-INF/org/languagetool/language-module.properties'
    doLast {
        def classes = registries.collectMany { registry ->
            def module = new Properties()
            registry.withReader('UTF-8') { module.load(it) }
            module.getProperty('languageClasses').split(',').toList()
        }
        def registry = destinationDir.toPath().resolve('META-INF/org/languagetool/language-module.properties').toFile()
        registry.parentFile.mkdirs()
        registry.setText("languageClasses=${classes.join(',')}\n", 'UTF-8')
    }
}
