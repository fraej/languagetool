name: Android offline app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'languagetool-core/**'
      - 'languagetool-language-modules/en/**'
      - 'pom.xml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'languagetool-core/**'
      - 'languagetool-language-modules/en/**'
      - 'pom.xml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test engine, lint, and build APKs
        run: ./gradlew :engine:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: languagetool-offline-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-and-lint-reports
          path: |
            android/engine/build/reports/tests/
            android/app/build/reports/lint-results-debug.*

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: languagetool-offline-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed APK without network access
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w org.languagetool.android.offline.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            grep -q 'OK (' device-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results-api-${{ matrix.api }}
          path: device-tests.txt
